<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey - Premium Trip Planner</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Theme Toggle -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Dark/Light Mode">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <!-- App Container -->
    <div class="app-wrapper">
        <!-- Hero Section -->
        <header class="hero-section" id="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">Where to next?</h1>
                <p class="hero-subtitle">Let our AI craft the perfect itinerary for your next adventure.</p>
                <form id="trip-search-form" class="search-form">
                    <input type="text" id="trip-query" class="search-input" placeholder="e.g. Plan a 5-day road trip from SF to LA" required>
                    <button type="submit" class="search-btn" id="search-btn">
                        <span class="btn-text">Inspire Me</span>
                        <div class="loader hidden"></div>
                    </button>
                </form>
            </div>
            <div class="hero-bg-image"></div>
        </header>

        <!-- Main Dashboard (Hidden until search) -->
        <main class="dashboard hidden" id="dashboard">
            <!-- Sidebar: Sticky Timeline Progress -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Trip Progress</h2>
                </div>
                <div class="timeline-nav" id="timeline-nav">
                    <!-- Nav items generated via JS -->
                </div>
                <div class="agent-status">
                    <span class="status-indicator active" id="agent-indicator"></span>
                    <span id="agent-message">Standing by</span>
                </div>
            </aside>

            <!-- Center Panel: Structured Itinerary Cards -->
            <section class="itinerary-feed" id="itinerary-feed">
                <!-- Cards appended here via JS parser -->
            </section>

            <!-- Right Panel: Google Map -->
            <section class="map-panel">
                <div id="google-map-container" class="map-container">
                    <!-- Google Maps JS API will attach here -->
                </div>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
